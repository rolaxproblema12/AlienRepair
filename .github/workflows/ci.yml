name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test, build
    # Fijado a windows-2022 porque windows-latest se está moviendo a
    # windows-2025-vs2026 (mayo 2026) y rompe el toolchain de electron-builder.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — paridad con la versión del dev (Node 24+) y npm 10+,
          # que entiende lockfileVersion 3 sin falsos positivos de "missing"
          # que sufríamos con npm 10 antiguo de Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run
        env:
          # Dummies para que `createClient` no aborte. Los tests mockean
          # supabase per-archivo, pero la inicialización del cliente en
          # src/lib/supabase.ts corre al import (top-level) y necesita
          # url+key válidos sintácticamente.
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-dummy

      - name: Build
        run: npm run build
        env:
          # Mismos secrets que el workflow de release. Si no están
          # configurados, el build igual compila — supabase.ts solo
          # emite `console.warn` y la app levanta sin conexión real
          # (CI no la ejecuta, solo verifica que compile).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
