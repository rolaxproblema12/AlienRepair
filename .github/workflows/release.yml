name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build, sign, publish, upload sourcemaps
    # Fijado a windows-2022 porque windows-latest se está moviendo a
    # windows-2025-vs2026 (mayo 2026) y rompe el toolchain de electron-builder.
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — paridad con la versión del dev (Node 24+) y npm 10+,
          # que entiende lockfileVersion 3 sin falsos positivos de "missing"
          # que sufríamos con npm 10 antiguo de Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build & publish to GitHub Releases
        run: npm run dist:win
        env:
          # GH_TOKEN auto-provisto por Actions; permisos de write se piden en
          # el bloque `permissions` de arriba (`contents: write`).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Conectividad de la app empacada → Supabase. Estos secrets DEBEN
          # estar configurados en Settings → Secrets and variables → Actions
          # del repo. Sin ellos el binario sale sin URL/anon key y crashea
          # al intentar autenticarse.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Sentry para reportes de errores (opcional — si no están,
          # captureUnlessBenign degrada silenciosamente).
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN_MAIN: ${{ secrets.SENTRY_DSN_MAIN }}
          # Firma de código (descomentar cuando llegue el certificado).
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload sourcemaps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: alienrepair@${{ github.ref_name }}
          sourcemaps: ./dist ./dist-electron
