<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AlienRepair</title>
    <script>
      // Aplicar tema antes del primer paint para evitar FOIT (white flash).
      // Lee localStorage; default 'dark' si no hay preferencia guardada.
      (function () {
        try {
          var t = localStorage.getItem('alien:theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
